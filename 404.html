<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>404 · Página no encontrada | Cero Studio</title>
  <meta name="description" content="La página que buscas no existe. Vuelve al inicio de Cero Studio o explora nuestro blog.">
  <link rel="canonical" href="https://cerostudio.ai/404">
  <link rel="apple-touch-icon" href="/CS_Favicon_512x512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
    as="style" data-async>
  <noscript><link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"></noscript>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{background:#131313;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    .err-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:60px 24px;text-align:center}
    .err-inner{max-width:580px}
    .err-logo{display:block;height:72px;width:auto;margin:0 auto 64px;opacity:.85}
    .err-code{font-family:'Space Grotesk',sans-serif;font-size:clamp(96px,18vw,200px);font-weight:700;letter-spacing:-.04em;line-height:.9;margin:0 0 24px;color:#fff}
    .err-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,4vw,38px);font-weight:600;margin:0 0 16px;letter-spacing:-.02em;color:#fff}
    .err-desc{font-size:16px;line-height:1.65;opacity:.7;margin:0 0 40px}
    .err-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    .err-btn{display:inline-block;padding:14px 28px;border-radius:999px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:.05em;text-decoration:none;transition:transform .2s,background .2s,color .2s}
    .err-btn:hover{transform:translateY(-2px)}
    .err-btn-primary{background:#b2f700;color:#131313}
    .err-btn-primary:hover{background:#fff}
    .err-btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2)}
    .err-btn-ghost:hover{border-color:#b2f700;color:#b2f700}
  </style>
</head>
<body>
  <main class="err-wrap">
    <div class="err-inner">
      <a href="/" aria-label="Cero Studio — Inicio"><img src="/images/svg/Cero_Studio_AI.svg" alt="Cero Studio" class="err-logo" width="1434" height="742"></a>
      <h1 class="err-code">404</h1>
      <p class="err-title">Esta página no existe.</p>
      <p class="err-desc">El enlace está roto, la URL cambió, o esto nunca fue una página. Vuelve al inicio o explora nuestros servicios.</p>
      <div class="err-actions">
        <a href="/" class="err-btn err-btn-primary">Volver al inicio</a>
        <a href="/blog/" class="err-btn err-btn-ghost">Ir al blog</a>
      </div>
    </div>
  </main>
</body>
</html>
