<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Project Brief — Cero Studio</title>
  <!-- ── Open Graph ── -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cerostudio.ai/brief/en/">
  <meta property="og:title" content="Project Brief — Cero Studio">
  <meta property="og:description" content="Tell us about your project. Fill out the brief so we can start working together.">
  <meta property="og:image" content="https://cerostudio.ai/images/CERO_Studio_SocialShare.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Cero Studio — Premium Digital Agency">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="Cero Studio">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstile&render=explicit" async defer></script>
  <link rel="stylesheet" href="../../css/base.css">
  <style>
    :root {
      --gt: #777777; --gl: #aaaaaa;
      --f: var(--fb);
    }
    body { display: flex; flex-direction: column; min-height: 100dvh; }

    /* ── HEADER */
    #hd {
      position: sticky; top: 0; z-index: 100; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.04); background: var(--black);
    }
    #dots { display: flex; gap: 4px; align-items: center; }
    .dot { height: 3px; border-radius: 2px; transition: all .5s cubic-bezier(.16,1,.3,1); }

    /* ── MAIN */
    #mn { flex: 1; display: flex; justify-content: center; padding: 36px 20px 140px; overflow-y: auto; }
    #ct { max-width: 580px; width: 100%; }
    .fade { animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:none } }

    /* ── TYPOGRAPHY */
    .sn { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gt); margin-bottom: 6px; font-weight: 600; }
    .st { font-size: 28px; font-weight: 700; font-family: var(--fd); letter-spacing: -.035em; margin: 0 0 6px; line-height: 1.1; }
    .st.big { font-size: 40px; }
    .sd { font-size: 14px; color: var(--gt); margin: 0 0 36px; line-height: 1.5; }

    /* ── FIELDS */
    .field { margin-bottom: 28px; }
    .lbl { display: block; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.85); margin-bottom: 10px; letter-spacing: .01em; }
    .req { color: var(--lime); margin-left: 4px; font-size: 11px; }
    .inp, .ta {
      width: 100%; padding: 13px 0; background: transparent; border: none;
      border-bottom: 1px solid rgba(255,255,255,.1); color: var(--white);
      font-size: 15px; font-family: var(--fd); outline: none;
      transition: border-color .3s ease; letter-spacing: .01em;
    }
    .inp:focus, .ta:focus { border-bottom-color: var(--lime); }
    .ta { resize: vertical; min-height: 72px; }

    /* ── RADIO */
    .rg { display: flex; flex-direction: column; gap: 6px; }
    .rb {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: transparent; border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
      cursor: pointer; text-align: left; font-family: var(--fd); color: var(--gl);
      font-size: 14px; width: 100%; transition: all .25s ease;
    }
    .rb:hover { border-color: rgba(255,255,255,.15); }
    .rb.on { background: rgba(184,255,0,.06); border-color: var(--lime); color: var(--white); }
    .rc { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; transition: border-color .25s ease; }
    .rb.on .rc { border-color: var(--lime); }
    .rd { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); display: none; }
    .rb.on .rd { display: block; }

    /* ── CHECKBOX */
    .cg { display: flex; flex-wrap: wrap; gap: 6px; }
    .cb {
      padding: 9px 16px; background: transparent; color: var(--gl);
      border: 1px solid rgba(255,255,255,.08); border-radius: 24px;
      cursor: pointer; font-size: 13px; font-family: var(--fd); font-weight: 400;
      transition: all .2s ease;
    }
    .cb.on { background: var(--lime); color: var(--black); border-color: var(--lime); font-weight: 600; }

    /* ── WELCOME BOX */
    .wbox { padding: 16px 20px; background: rgba(184,255,0,.04); border: 1px solid rgba(184,255,0,.1); border-radius: 10px; margin-top: 8px; }
    .eyebrow { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--lime); margin-bottom: 10px; font-weight: 700; }
    .prow { display: flex; gap: 12px; align-items: baseline; margin-bottom: 6px; }
    .pnum { font-size: 11px; color: var(--lime); font-weight: 700; min-width: 20px; }
    .ptitle { font-size: 13px; color: var(--white); font-weight: 600; }
    .pdesc { font-size: 12px; color: var(--gt); }

    /* ── REVIEW */
    .rsec { margin-bottom: 28px; }
    .rlbl { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--lime); margin-bottom: 14px; font-weight: 700; }
    .ritem { margin-bottom: 10px; }
    .rkey { font-size: 11px; color: var(--gt); margin-bottom: 2px; }
    .rval { font-size: 14px; color: var(--white); line-height: 1.5; }

    /* ── FOOTER NAV */
    #ft {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 24px;
      background: linear-gradient(transparent, var(--black) 25%);
      display: flex; justify-content: space-between; align-items: center; z-index: 100;
    }
    .btn-back {
      padding: 12px 20px; background: transparent; border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; cursor: pointer; font-size: 12px; font-family: var(--fd);
      letter-spacing: .04em; text-transform: uppercase; font-weight: 600; color: var(--gl);
      transition: all .2s ease;
    }
    .btn-back:disabled { color: rgba(255,255,255,.1); border-color: rgba(255,255,255,.04); cursor: default; }
    .btn-next {
      padding: 14px 36px; background: var(--lime); color: var(--black); border: none;
      border-radius: 8px; cursor: pointer; font-size: 13px; font-family: var(--fd);
      letter-spacing: .06em; text-transform: uppercase; font-weight: 800; transition: all .2s ease;
    }
    .btn-next:disabled { background: var(--gray3); cursor: default; opacity: .5; }

    /* ── SUCCESS */
    .success { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 32px; }
    .si { text-align: center; max-width: 500px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 20px;
      background: rgba(184,255,0,.08); border: 1px solid rgba(184,255,0,.2); margin-bottom: 20px;
    }
    .bdot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }
    .btxt { font-size: 11px; color: var(--lime); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .sbox { padding: 16px 20px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06); border-radius: 10px; margin: 24px 0 32px; text-align: left; }
    .srow { display: flex; gap: 10px; align-items: baseline; margin-bottom: 5px; }
    .snum { font-size: 10px; color: var(--lime); font-weight: 700; min-width: 18px; }
    .stxt { font-size: 13px; color: var(--gl); }
    .wa-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 15px 36px;
      background: var(--lime); color: var(--black); border: none; border-radius: 8px;
      font-size: 13px; font-family: var(--fd); cursor: pointer; letter-spacing: .06em;
      text-transform: uppercase; font-weight: 800; text-decoration: none;
    }

    /* ── SVG pulse */
    @keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .pulse { animation: dotPulse 2.4s ease-in-out infinite; }
  </style>
</head>
<body>

<div id="cf-ts" style="display:none"></div>
<header id="hd">
  <img src="../../images/svg/Cero_Studio_AI_Horizontal.svg" alt="Cero Studio" class="nav-logo">
  <div id="dots"></div>
</header>

<main id="mn">
  <div id="ct"></div>
</main>

<footer id="ft">
  <button class="btn-back" id="btn-back" disabled>← Back</button>
  <button class="btn-next" id="btn-next">Continue →</button>
</footer>

<script>
/* ── CONFIG ────────────────────────────────────────────── */
const WORKER             = 'https://intake.cerostudio.ai';
const WA_NUM             = '525531007101';
const TURNSTILE_SITE_KEY = '0x4AAAAAAC-D_ms0Xx25W9m6';

/* ── DATA ──────────────────────────────────────────────── */
const STEPS = [
  { id:'welcome',  label:'Welcome' },
  { id:'contact',  label:'Contact' },
  { id:'business', label:'Business' },
  { id:'project',  label:'Project' },
  { id:'design',   label:'Visual Direction' },
  { id:'content',  label:'Content & Assets' },
  { id:'timeline', label:'Timeline & Budget' },
  { id:'review',   label:'Review' },
];

const FIELDS = {
  contact: [
    { key:'name',    label:'Full name',                               type:'text',  required:true,  placeholder:'Your first and last name' },
    { key:'email',   label:'Email address',                           type:'email', required:true,  placeholder:'you@email.com' },
    { key:'phone',   label:'Phone / WhatsApp',                        type:'tel',   required:true,  placeholder:'+1 (555) 000-0000' },
    { key:'company', label:'Company or business',                     type:'text',  required:false, placeholder:'If applicable' },
    { key:'lang',    label:'What language do you prefer to communicate in?', type:'radio', required:true, options:['English','Español','Both — bilingual'] },
  ],
  business: [
    { key:'businessName',   label:'Business name (as it will appear on the site)',  type:'text',     required:true,  placeholder:'Commercial name' },
    { key:'industry',       label:'Industry or sector',                              type:'text',     required:true,  placeholder:'E.g.: Restaurant, Legal consulting, Retail...' },
    { key:'location',       label:'Primary business location',                       type:'text',     required:true,  placeholder:'City, State (E.g.: Houston, TX)' },
    { key:'targetAudience', label:'Who are your ideal customers?',                   type:'textarea', required:true,  placeholder:'Describe who you sell to: age, location, language, income level, what they are looking for...' },
    { key:'competitors',    label:'Competitors or similar businesses you admire',    type:'textarea', required:false, placeholder:'Names or URLs of businesses in your industry whose digital presence you like' },
    { key:'usp',            label:'What makes your business different?',             type:'textarea', required:true,  placeholder:'Your competitive advantage — what your customers say made them choose you' },
  ],
  project: [
    { key:'projectType', label:'What do you need?', type:'check', required:true, options:[
      'Professional website (informational)','Online store (eCommerce)','Website + Blog / CMS',
      'Landing page (single page)','Redesign of existing site','Not sure — I need advice',
    ]},
    { key:'currentSite',     label:'URL of your current site (if you have one)',      type:'text',     required:false, placeholder:'https://...' },
    { key:'currentSitePain', label:'If you have a site, what is not working?',        type:'textarea', required:false, placeholder:'What frustrates you about your current site? What is failing?' },
    { key:'pages', label:'What sections does your site need?', type:'check', required:false, options:[
      'Home','About Us','Services','Portfolio / Gallery',
      'Shop / Product catalog','Blog / News','Contact','Reservations / Booking',
      'Menu (Restaurant)','Testimonials / Reviews','FAQ','Client area / Login',
    ]},
    { key:'features', label:'Features you need', type:'check', required:false, options:[
      'Contact form','Direct WhatsApp','Reservation / appointment system',
      'Shopping cart / online payments','Blog I can update myself','Multi-language (English / Spanish)',
      'Social media integration','Google Maps','Email marketing / Newsletter',
      'SEO optimized','Google Analytics / metrics','Live chat',
    ]},
    { key:'ecommProducts', label:'If it is an online store: how many products?', type:'radio', required:false, options:['Not applicable','1–20','20–50','50–200','More than 200'] },
  ],
  design: [
    { key:'visualDirection', label:'What visual style appeals to you most?', type:'check', required:true, options:[
      'Dark and premium (black, strong contrasts)','Clean and minimalist (lots of white space)',
      'Colorful and energetic','Elegant and sophisticated','Modern and tech-forward','Warm and approachable',
      'Rustic / artisanal','I trust Cero Studio\'s creative direction',
    ]},
    { key:'referenceSites',    label:'Share 2–3 websites you like and tell us why',       type:'textarea', required:false, placeholder:'URLs and what you like about each: the design? the structure? how it feels?' },
    { key:'avoidance',         label:'Is there anything you do NOT want on your site?',   type:'textarea', required:false, placeholder:'Colors you hate, styles that don\'t fit your brand, things you dislike...' },
    { key:'hasLogo',           label:'Do you have a logo?',                               type:'radio',    required:true,  options:['Yes — professional and ready to use','Yes — but it needs updating','No — I need one'] },
    { key:'hasBrandColors',    label:'Do you have defined brand colors?',                 type:'radio',    required:true,  options:['Yes — I have a defined palette','I have an idea but it\'s not formalized','No — I need a proposal'] },
    { key:'brandColorsDetail', label:'If you have colors, share them here',               type:'text',     required:false, placeholder:'E.g.: Navy blue #1B3A5C and gold #C9A84C' },
  ],
  content: [
    { key:'contentStatus', label:'What content do you have ready?', type:'radio', required:true, options:[
      'Everything ready (copy, photos, videos)','Partial — I have photos but missing copy',
      'Partial — I have copy but missing photos','Nothing — I need Cero Studio to generate everything',
    ]},
    { key:'photoStatus', label:'Photography of your business / products', type:'radio', required:true, options:[
      'I have professional high-quality photos','I have photos but they are not professional',
      'I don\'t have any — you can use stock or AI','I need photography services (quoted separately)',
    ]},
    { key:'hasExistingContent', label:'Do you have existing materials you want to reuse?', type:'check', required:false, options:[
      'High-resolution logo','Brand manual / identity guide','Product photos',
      'Business / team photos','Already written copy','Videos','Menu / catalog in PDF','None of the above',
    ]},
    { key:'contentNotes', label:'Notes about content', type:'textarea', required:false, placeholder:'Is there something specific you want to communicate? A key message? A particular tone?' },
  ],
  timeline: [
    { key:'goal', label:'Primary goal of the site', type:'radio', required:true, options:[
      'Generate clients / leads','Sell products online','Give my business a professional presence',
      'Replace my current site','Rank on Google (SEO)','Inform and educate my customers',
    ]},
    { key:'budget', label:'Approximate budget (USD)', type:'radio', required:true, options:[
      'Under $800','$800 – $1,500','$1,500 – $3,000','$3,000 – $5,000','Over $5,000',
      'Not sure — I need a quote',
    ]},
    { key:'timeline', label:'When do you need the site ready?', type:'radio', required:true, options:[
      'As soon as possible (urgent)','2 to 4 weeks','1 to 2 months',
      'No rush — I want it to be perfect','I have a specific date',
    ]},
    { key:'deadlineDetail',  label:'If you have a specific date, what is it?',                        type:'text',     required:false, placeholder:'E.g.: Before June 15th — product launch' },
    { key:'maintenance',     label:'Are you interested in monthly maintenance after launch?',          type:'radio',    required:false, options:['Yes — I want Cero Studio to maintain it','Maybe — I want to know more','No — I\'ll handle it myself'] },
    { key:'additionalNotes', label:'Anything else we should know?',                                    type:'textarea', required:false, placeholder:'Any details, concerns or questions...' },
  ],
};

const DESCS = {
  welcome:  'Tell us about your project so we can design something extraordinary.',
  contact:  'Who will we be working with?',
  business: 'We need to understand your business to design something that works.',
  project:  'Define the scope of what you need.',
  design:   'This directly feeds the visual design in Google Stitch.',
  content:  'What materials do you have ready to get started?',
  timeline: 'Deadlines, budget and goals.',
  review:   'Review everything before submitting.',
};

/* ── STATE ─────────────────────────────────────────────── */
const S = { step: 0, data: {}, sending: false, briefId: null };

/* ── TURNSTILE ─────────────────────────────────────────── */
let tsWidgetId        = null;
let tsToken           = null;
let tsPendingResolve  = null;

function onloadTurnstile() {
  tsWidgetId = turnstile.render('#cf-ts', {
    sitekey:            TURNSTILE_SITE_KEY,
    size:               'invisible',
    execution:          'execute',
    callback(token) {
      tsToken = token;
      if (tsPendingResolve) { tsPendingResolve(token); tsPendingResolve = null; }
    },
    'error-callback'() {
      if (tsPendingResolve) { tsPendingResolve(null); tsPendingResolve = null; }
    },
    'expired-callback'() { tsToken = null; },
  });
}

function getTurnstileToken() {
  return new Promise(resolve => {
    if (tsToken) return resolve(tsToken);
    if (!window.turnstile || tsWidgetId === null) return resolve(null);
    tsPendingResolve = resolve;
    turnstile.execute(tsWidgetId);
    setTimeout(() => {
      if (tsPendingResolve) { tsPendingResolve(null); tsPendingResolve = null; }
    }, 15000);
  });
}

/* ── HELPERS ───────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function hasVal(v) { return v && (Array.isArray(v) ? v.length > 0 : String(v).trim().length > 0); }

function canProceed() {
  const { id } = STEPS[S.step];
  if (id === 'welcome' || id === 'review') return true;
  return (FIELDS[id] || []).filter(f => f.required).every(f => hasVal(S.data[f.key]));
}

/* ── RENDER HELPERS ────────────────────────────────────── */
function renderField(f) {
  const v = S.data[f.key];
  const lbl = `<label class="lbl">${esc(f.label)}${f.required ? '<span class="req">*</span>' : ''}</label>`;

  if (f.type === 'radio') {
    const opts = f.options.map(opt => {
      const on = v === opt;
      return `<button class="rb${on?' on':''}" data-radio="${esc(f.key)}" data-val="${esc(opt)}">
        <div class="rc"><div class="rd"></div></div>
        <span>${esc(opt)}</span>
      </button>`;
    }).join('');
    return `<div class="field">${lbl}<div class="rg">${opts}</div></div>`;
  }

  if (f.type === 'check') {
    const sel = v || [];
    const opts = f.options.map(opt =>
      `<button class="cb${sel.includes(opt)?' on':''}" data-check="${esc(f.key)}" data-val="${esc(opt)}">${esc(opt)}</button>`
    ).join('');
    return `<div class="field">${lbl}<div class="cg">${opts}</div></div>`;
  }

  if (f.type === 'textarea') {
    return `<div class="field">${lbl}<textarea class="ta" data-key="${esc(f.key)}" placeholder="${esc(f.placeholder||'')}" rows="3">${esc(v||'')}</textarea></div>`;
  }

  return `<div class="field">${lbl}<input class="inp" type="${f.type}" data-key="${esc(f.key)}" value="${esc(v||'')}" placeholder="${esc(f.placeholder||'')}"></div>`;
}

function renderWelcome() {
  return `
    <div style="color:var(--gl);font-size:15px;line-height:1.75">
      <p style="margin-bottom:20px">This form generates your <strong style="color:var(--white)">project brief</strong> — the document that guides every design and development decision.</p>
      <p style="margin-bottom:20px">Estimated time: <strong style="color:var(--white)">10–12 minutes</strong>. All information is confidential.</p>
      <div class="wbox">
        <div class="eyebrow">Our process</div>
        ${[['01','Brief','This form — you tell us everything about your business'],['02','Proposal','We send you a personalized proposal within 24 hrs'],['03','Design','We define the visual direction and site structure'],['04','Development','We build your site to international standards'],['05','Launch','QA, SEO optimization and go-live']].map(([n,t,d]) =>
          `<div class="prow"><span class="pnum">${n}</span><span class="ptitle">${t}</span><span class="pdesc">&nbsp;— ${d}</span></div>`
        ).join('')}
      </div>
    </div>`;
}

function renderReview() {
  return ['contact','business','project','design','content','timeline'].map(sId => {
    const sf = FIELDS[sId];
    const sl = STEPS.find(s => s.id === sId)?.label || sId;
    if (!sf.some(f => hasVal(S.data[f.key]))) return '';
    const items = sf.map(f => {
      const v = S.data[f.key];
      if (!hasVal(v)) return '';
      return `<div class="ritem"><div class="rkey">${esc(f.label)}</div><div class="rval">${esc(Array.isArray(v) ? v.join(' · ') : v)}</div></div>`;
    }).join('');
    return `<div class="rsec"><div class="rlbl">${esc(sl)}</div>${items}</div>`;
  }).join('');
}

/* ── MAIN RENDER ───────────────────────────────────────── */
function render() {
  const { id, label } = STEPS[S.step];
  const total = STEPS.length;

  /* Dots */
  $('dots').innerHTML = STEPS.map((_,i) => {
    const w = i === S.step ? 24 : 6;
    const bg = i === S.step ? '#b2f700' : i < S.step ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.08)';
    return `<div class="dot" style="width:${w}px;background:${bg}"></div>`;
  }).join('');

  /* Step number */
  const numHtml = id !== 'welcome' && id !== 'review'
    ? `<div class="sn">${String(S.step).padStart(2,'0')} / ${String(total-2).padStart(2,'0')}</div>` : '';

  /* Content */
  let body = '';
  if (id === 'welcome') body = renderWelcome();
  else if (id === 'review') body = renderReview();
  else body = (FIELDS[id] || []).map(f => renderField(f)).join('');

  $('ct').innerHTML = `<div class="fade">${numHtml}<h1 class="st${id==='welcome'?' big':''}">${esc(label)}</h1><p class="sd">${esc(DESCS[id]||'')}</p>${body}</div>`;

  /* Scroll top */
  $('mn').scrollTop = 0;

  /* Nav */
  const back = $('btn-back');
  const next = $('btn-next');
  back.disabled = S.step === 0;
  back.style.color = S.step === 0 ? 'rgba(255,255,255,.1)' : '';
  back.style.borderColor = S.step === 0 ? 'rgba(255,255,255,.04)' : '';
  next.textContent = id === 'review' ? (S.sending ? 'Sending...' : 'Submit Brief →') : 'Continue →';
  next.disabled = !canProceed() || S.sending;
}

function refreshNext() {
  $('btn-next').disabled = !canProceed() || S.sending;
}

/* ── EVENTS (delegated) ────────────────────────────────── */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.key) { S.data[el.dataset.key] = el.value; refreshNext(); }
});

document.addEventListener('click', e => {
  /* Radio */
  const rb = e.target.closest('[data-radio]');
  if (rb) {
    S.data[rb.dataset.radio] = rb.dataset.val;
    document.querySelectorAll(`[data-radio="${rb.dataset.radio}"]`).forEach(b =>
      b.classList.toggle('on', b.dataset.val === rb.dataset.val)
    );
    refreshNext();
    return;
  }

  /* Checkbox */
  const cb = e.target.closest('[data-check]');
  if (cb) {
    const key = cb.dataset.check;
    const val = cb.dataset.val;
    const cur = S.data[key] || [];
    S.data[key] = cur.includes(val) ? cur.filter(v => v !== val) : [...cur, val];
    cb.classList.toggle('on', S.data[key].includes(val));
    refreshNext();
    return;
  }
});

/* ── NAVIGATION ────────────────────────────────────────── */
$('btn-back').addEventListener('click', () => {
  if (S.step > 0) { S.step--; render(); }
});

$('btn-next').addEventListener('click', () => {
  const { id } = STEPS[S.step];
  if (id === 'review') { handleSubmit(); }
  else if (S.step < STEPS.length - 1) { S.step++; render(); }
});

/* ── SUBMIT ────────────────────────────────────────────── */
async function handleSubmit() {
  S.sending = true;
  render();

  const briefText = generateBrief();
  const cfToken   = await getTurnstileToken();

  tsToken = null;
  if (tsWidgetId !== null) turnstile.reset(tsWidgetId);

  try {
    const res = await fetch(`${WORKER}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...S.data, briefText, cf_turnstile_response: cfToken || '' }),
    });
    const result = await res.json();
    if (!result.success) throw new Error(result.error || 'Error');
    S.briefId = result.briefId;
  } catch {
    /* Fallback: open mailto with brief */
    const subj = encodeURIComponent(`New Brief — ${S.data.businessName || S.data.name || ''}`);
    const body = encodeURIComponent(briefText);
    window.open(`mailto:hola@cerostudio.ai?subject=${subj}&body=${body}`, '_blank');
  }

  S.sending = false;
  showSuccess();
}

function showSuccess() {
  const waMsg = encodeURIComponent(
    `Hi, I just submitted my project brief for ${S.data.businessName || 'my business'}. My name is ${S.data.name || ''}. What's the next step?`
  );
  const nextSteps = [
    ['01','We review your brief and prepare a proposal'],
    ['02','15-min call to align on visual direction'],
    ['03','We design your site in Google Stitch for your approval'],
    ['04','Development and implementation'],
    ['05','QA, optimization and launch'],
  ];

  $('hd').style.display = 'none';
  $('ft').style.display = 'none';
  $('mn').style.padding = '0';

  $('ct').innerHTML = `
    <div class="success">
      <div class="si">
        <div style="margin-bottom:32px">
          <svg width="56" height="56" viewBox="0 0 100 100" class="pulse">
            <circle cx="50" cy="50" r="42" fill="none" stroke="white" stroke-width="7"/>
            <circle cx="50" cy="50" r="7.5" fill="white"/>
          </svg>
        </div>
        <div class="badge">
          <div class="bdot"></div>
          <span class="btxt">Brief sent to Cero Studio${S.briefId ? ' — ' + esc(S.briefId) : ''}</span>
        </div>
        <h1 style="color:var(--white);font-size:32px;font-weight:800;letter-spacing:-.03em;margin:0 0 14px">We got your project!</h1>
        <p style="color:var(--gl);font-size:15px;line-height:1.65;margin:0 0 12px">
          Your brief is now in our team's hands. We'll reach out within the next <strong style="color:var(--white)">24 hours</strong> with a personalized proposal.
        </p>
        <p style="color:var(--gt);font-size:13px;line-height:1.5;margin:0 0 10px">Want to speed things up? Message us directly on WhatsApp.</p>
        <div class="sbox">
          <div class="eyebrow">Next steps</div>
          ${nextSteps.map(([n,t]) => `<div class="srow"><span class="snum">${n}</span><span class="stxt">${t}</span></div>`).join('')}
        </div>
        <a href="https://wa.me/${WA_NUM}?text=${waMsg}" target="_blank" rel="noopener" class="wa-btn">
          Message us on WhatsApp →
        </a>
      </div>
    </div>`;
}

/* ── BRIEF TEXT GENERATOR ──────────────────────────────── */
function generateBrief() {
  let t = '══════════════════════════════════════════\n  CERO STUDIO ◉ CLIENT BRIEF\n  cerostudio.ai\n══════════════════════════════════════════\n\n';
  ['contact','business','project','design','content','timeline'].forEach(sId => {
    const sf = FIELDS[sId];
    const sl = STEPS.find(s => s.id === sId)?.label || sId;
    t += `── ${sl.toUpperCase()} ${'─'.repeat(Math.max(0,38-sl.length))}\n\n`;
    sf.forEach(f => {
      const v = S.data[f.key];
      if (hasVal(v)) t += `  ${f.label}\n  → ${Array.isArray(v) ? v.join(', ') : v}\n\n`;
    });
  });
  t += `══════════════════════════════════════════\nDate: ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}\nGenerated by Cero Studio Intake System\n`;
  return t;
}

/* ── INIT ──────────────────────────────────────────────── */
render();
</script>
