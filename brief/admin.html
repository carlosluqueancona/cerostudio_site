<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Briefs — Cero Studio</title>
  <link rel="stylesheet" href="../css/base.css">
  <style>
    :root {
      --g1: #111; --g2: #1a1a1a; --g3: #2a2a2a;
      --gt: #666; --gl: #999;
    }
    body { min-height: 100dvh; }

    /* ── LOGIN ── */
    #login {
      min-height: 100dvh; display: flex; align-items: center;
      justify-content: center; padding: 32px;
    }
    .login-box { max-width: 380px; width: 100%; }
    .login-box img { margin-bottom: 40px; display: block; }
    .login-box h1 { font-family: var(--fd); font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .login-box p { font-size: 13px; color: var(--gt); margin-bottom: 28px; }
    .login-box input {
      width: 100%; padding: 13px 0; background: transparent; border: none;
      border-bottom: 1px solid rgba(255,255,255,.12); color: var(--white);
      font-size: 14px; font-family: var(--fb); outline: none;
      transition: border-color .3s; letter-spacing: .02em; margin-bottom: 20px;
    }
    .login-box input:focus { border-bottom-color: var(--lime); }
    .login-box button {
      width: 100%; padding: 14px; background: var(--lime); color: var(--black);
      border: none; border-radius: 8px; font-family: var(--fd); font-size: 13px;
      font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
      transition: opacity .2s;
    }
    .login-box button:hover { opacity: .88; }
    .login-err { font-size: 12px; color: #ff5555; margin-top: 10px; display: none; }

    /* ── APP ── */
    #app { display: none; flex-direction: column; min-height: 100dvh; }

    /* Header */
    #hd {
      position: sticky; top: 0; z-index: 100;
      padding: 0 28px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.06); background: var(--black);
    }
    #hd img { }
    .hd-right { display: flex; align-items: center; gap: 16px; }
    .badge-live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--lime); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .badge-live::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--lime); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .btn-logout { font-size: 11px; color: var(--gt); background: none; border: none; cursor: pointer; font-family: var(--fb); letter-spacing: .04em; text-transform: uppercase; transition: color .2s; }
    .btn-logout:hover { color: var(--white); }

    /* Layout */
    #layout { display: flex; flex: 1; overflow: hidden; height: calc(100dvh - 56px); }

    /* Sidebar */
    #sidebar {
      width: 340px; min-width: 340px; border-right: 1px solid rgba(255,255,255,.06);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sb-header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; justify-content: space-between; }
    .sb-title { font-family: var(--fd); font-size: 13px; font-weight: 600; }
    .sb-count { font-size: 11px; color: var(--gt); background: var(--g2); padding: 3px 8px; border-radius: 12px; }
    .btn-refresh { background: none; border: none; cursor: pointer; color: var(--gt); font-size: 16px; transition: color .2s; line-height: 1; }
    .btn-refresh:hover { color: var(--white); }
    #brief-list { overflow-y: auto; flex: 1; }

    /* Brief list item */
    .brief-item {
      padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,.04);
      cursor: pointer; transition: background .15s; position: relative;
    }
    .brief-item:hover { background: rgba(255,255,255,.03); }
    .brief-item.active { background: rgba(184,255,0,.05); border-left: 2px solid var(--lime); }
    .bi-name { font-size: 13px; font-weight: 600; font-family: var(--fd); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bi-biz { font-size: 11px; color: var(--gl); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bi-meta { display: flex; align-items: center; gap: 8px; }
    .bi-date { font-size: 10px; color: var(--gt); }
    .status-badge {
      font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 10px;
    }
    .s-new      { background: rgba(178,247,0,.12); color: var(--lime); }
    .s-reviewed { background: rgba(100,160,255,.12); color: #64a0ff; }
    .s-proposal_sent { background: rgba(255,180,0,.12); color: #ffb400; }
    .s-approved { background: rgba(0,220,120,.12); color: #00dc78; }
    .s-in_progress { background: rgba(160,100,255,.12); color: #a064ff; }
    .s-delivered { background: rgba(0,200,200,.12); color: #00c8c8; }
    .s-archived { background: rgba(120,120,120,.12); color: #888; }

    /* Empty state */
    .empty { padding: 48px 20px; text-align: center; color: var(--gt); font-size: 13px; }

    /* Detail panel */
    #detail {
      flex: 1; overflow-y: auto; padding: 28px 32px;
      display: flex; align-items: center; justify-content: center;
    }
    .detail-empty { text-align: center; color: var(--gt); }
    .detail-empty p { font-size: 13px; margin-top: 8px; }

    /* Detail content */
    .detail-content { max-width: 700px; width: 100%; }
    .detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
    .detail-id { font-size: 10px; color: var(--lime); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
    .detail-name { font-family: var(--fd); font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .detail-biz { font-size: 14px; color: var(--gl); }
    .detail-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .status-select {
      padding: 8px 12px; background: var(--g2); border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px; color: var(--white); font-family: var(--fb); font-size: 12px;
      cursor: pointer; outline: none;
    }
    .btn-copy {
      padding: 8px 14px; background: transparent; border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px; color: var(--gl); font-family: var(--fb); font-size: 12px;
      cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .btn-copy:hover { border-color: var(--lime); color: var(--white); }

    /* Detail meta row */
    .meta-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      padding: 16px 0; border-top: 1px solid rgba(255,255,255,.06);
      border-bottom: 1px solid rgba(255,255,255,.06); margin-bottom: 24px;
    }
    .meta-cell { }
    .meta-key { font-size: 10px; color: var(--gt); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .meta-val { font-size: 13px; color: var(--white); }

    /* Sections */
    .section { margin-bottom: 24px; }
    .section-title {
      font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
      color: var(--lime); margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(184,255,0,.1);
    }
    .field-row { display: grid; grid-template-columns: 180px 1fr; gap: 12px; margin-bottom: 10px; align-items: baseline; }
    .field-key { font-size: 11px; color: var(--gt); line-height: 1.5; }
    .field-val { font-size: 13px; color: var(--white); line-height: 1.6; }
    .field-val.empty-val { color: var(--g3); font-style: italic; }

    /* Loading */
    .loading { text-align: center; padding: 48px; color: var(--gt); font-size: 13px; }

    @media (max-width: 768px) {
      #layout { flex-direction: column; height: auto; overflow: visible; }
      #sidebar { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid rgba(255,255,255,.06); max-height: 40vh; }
      #detail { padding: 20px 16px; }
      .meta-row { grid-template-columns: repeat(2,1fr); }
      .field-row { grid-template-columns: 1fr; gap: 2px; }
      .field-key { font-size: 10px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <img src="../images/svg/Cero_Studio_AI_Horizontal.svg" alt="Cero Studio" class="nav-logo">
    <h1>Panel de Briefs</h1>
    <p>Ingresa tu API key para acceder.</p>
    <input type="password" id="key-input" placeholder="API Key" autocomplete="off">
    <button onclick="doLogin()">Acceder →</button>
    <p class="login-err" id="login-err">API key incorrecta. Inténtalo de nuevo.</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header id="hd">
    <img src="../images/svg/Cero_Studio_AI_Horizontal.svg" alt="Cero Studio" class="nav-logo">
    <div class="hd-right">
      <span class="badge-live">Live</span>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="sb-header">
        <span class="sb-title">Briefs recibidos</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="sb-count" id="count">—</span>
          <button class="btn-refresh" onclick="loadBriefs()" title="Actualizar">↻</button>
        </div>
      </div>
      <div id="brief-list"><div class="loading">Cargando...</div></div>
    </aside>

    <section id="detail">
      <div class="detail-empty">
        <svg width="32" height="32" viewBox="0 0 100 100" style="opacity:.2;margin:0 auto 12px;display:block">
          <circle cx="50" cy="50" r="42" fill="none" stroke="white" stroke-width="7"/>
          <circle cx="50" cy="50" r="7.5" fill="white"/>
        </svg>
        <p>Selecciona un brief para verlo</p>
      </div>
    </section>
  </div>
</div>

<script>
const WORKER = 'https://intake.cerostudio.ai';

const STATUSES = {
  new:           'Nuevo',
  reviewed:      'Revisado',
  proposal_sent: 'Propuesta enviada',
  approved:      'Aprobado',
  in_progress:   'En desarrollo',
  delivered:     'Entregado',
  archived:      'Archivado',
};

const SECTION_LABELS = {
  contact:  'Contacto',
  business: 'Negocio',
  project:  'Proyecto',
  design:   'Dirección Visual',
  content:  'Contenido & Assets',
  timeline: 'Timeline & Budget',
};

const FIELD_LABELS = {
  name:'Nombre', email:'Email', phone:'Teléfono', company:'Empresa', lang:'Idioma preferido',
  business_name:'Nombre del negocio', industry:'Giro/industria', location:'Ubicación',
  target_audience:'Clientes ideales', competitors:'Competidores referencia', usp:'Diferenciador',
  project_type:'Tipo de proyecto', current_site:'Sitio actual', current_site_pain:'Problemas actuales',
  pages:'Secciones', features:'Funcionalidades', ecomm_products:'Productos eCommerce',
  visual_direction:'Estilo visual', reference_sites:'Sitios referencia', avoidance:'Evitar',
  has_logo:'Logotipo', has_brand_colors:'Colores de marca', brand_colors_detail:'Detalle colores',
  content_status:'Estado del contenido', photo_status:'Fotografía', existing_content:'Materiales existentes', content_notes:'Notas contenido',
  goal:'Objetivo principal', budget:'Presupuesto', timeline:'Timeline', deadline_detail:'Fecha específica',
  maintenance:'Mantenimiento', additional_notes:'Notas adicionales',
};

const SECTIONS = {
  contact:  ['name','email','phone','company','lang'],
  business: ['business_name','industry','location','target_audience','competitors','usp'],
  project:  ['project_type','current_site','current_site_pain','pages','features','ecomm_products'],
  design:   ['visual_direction','reference_sites','avoidance','has_logo','has_brand_colors','brand_colors_detail'],
  content:  ['content_status','photo_status','existing_content','content_notes'],
  timeline: ['goal','budget','timeline','deadline_detail','maintenance','additional_notes'],
};

let apiKey = '';
let briefs = [];
let currentId = null;

/* ── AUTH ── */
function doLogin() {
  const k = document.getElementById('key-input').value.trim();
  if (!k) return;
  apiKey = k;
  sessionStorage.setItem('cs_admin_key', k);
  loadBriefs();
}

document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function logout() {
  sessionStorage.removeItem('cs_admin_key');
  apiKey = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('key-input').value = '';
}

/* ── FETCH ── */
async function loadBriefs() {
  document.getElementById('brief-list').innerHTML = '<div class="loading">Cargando...</div>';
  try {
    const res = await fetch(`${WORKER}/briefs`, { headers: { 'X-API-Key': apiKey } });
    if (res.status === 401) {
      document.getElementById('login-err').style.display = 'block';
      document.getElementById('app').style.display = 'none';
      document.getElementById('login').style.display = 'flex';
      apiKey = '';
      return;
    }
    const data = await res.json();
    briefs = data.briefs || [];
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderList();
  } catch {
    document.getElementById('brief-list').innerHTML = '<div class="loading">Error al cargar. Verifica la conexión.</div>';
  }
}

/* ── LIST ── */
function renderList() {
  document.getElementById('count').textContent = briefs.length;
  if (!briefs.length) {
    document.getElementById('brief-list').innerHTML = '<div class="empty">No hay briefs todavía.</div>';
    return;
  }
  document.getElementById('brief-list').innerHTML = briefs.map(b => `
    <div class="brief-item${b.brief_id === currentId ? ' active' : ''}" onclick="openBrief('${b.brief_id}')">
      <div class="bi-name">${esc(b.name || '—')}</div>
      <div class="bi-biz">${esc(b.business_name || b.company || 'Sin negocio')}</div>
      <div class="bi-meta">
        <span class="status-badge s-${b.status}">${STATUSES[b.status] || b.status}</span>
        <span class="bi-date">${formatDate(b.submitted_at)}</span>
      </div>
    </div>
  `).join('');
}

/* ── DETAIL ── */
async function openBrief(id) {
  currentId = id;
  renderList();
  document.getElementById('detail').innerHTML = '<div class="loading">Cargando brief...</div>';

  try {
    const res = await fetch(`${WORKER}/briefs/${id}`, { headers: { 'X-API-Key': apiKey } });
    const data = await res.json();
    renderDetail(data.brief);
  } catch {
    document.getElementById('detail').innerHTML = '<div class="loading">Error al cargar el brief.</div>';
  }
}

let currentBrief = null;

function renderDetail(b) {
  currentBrief = b;
  if (!b) { document.getElementById('detail').innerHTML = '<div class="loading">Brief no encontrado.</div>'; return; }

  const parseArr = v => { try { const p = JSON.parse(v); return Array.isArray(p) ? p : [v]; } catch { return v ? [v] : []; } };

  const sectionsHtml = Object.entries(SECTIONS).map(([sId, keys]) => {
    const rows = keys.map(k => {
      const raw = b[k];
      let val = raw;
      if (typeof raw === 'string' && (raw.startsWith('[') || raw.startsWith('{'))) {
        const arr = parseArr(raw);
        val = arr.length ? arr.join(' · ') : null;
      }
      const empty = !val || String(val).trim() === '';
      return `<div class="field-row">
        <div class="field-key">${FIELD_LABELS[k] || k}</div>
        <div class="field-val${empty ? ' empty-val' : ''}">${empty ? 'No especificado' : esc(String(val))}</div>
      </div>`;
    }).join('');
    return `<div class="section">
      <div class="section-title">${SECTION_LABELS[sId]}</div>
      ${rows}
    </div>`;
  }).join('');

  document.getElementById('detail').innerHTML = `
    <div class="detail-content">
      <div class="detail-header">
        <div>
          <div class="detail-id">${esc(b.brief_id)}</div>
          <div class="detail-name">${esc(b.name || '—')}</div>
          <div class="detail-biz">${esc(b.business_name || b.company || '')}</div>
        </div>
        <div class="detail-actions">
          <select class="status-select" onchange="updateStatus('${b.brief_id}', this.value)">
            ${Object.entries(STATUSES).map(([v,l]) => `<option value="${v}"${b.status===v?' selected':''}>${l}</option>`).join('')}
          </select>
          <button class="btn-copy" onclick="copyBrief()">Copiar brief</button>
        </div>
      </div>

      <div class="meta-row">
        <div class="meta-cell"><div class="meta-key">Email</div><div class="meta-val">${esc(b.email||'—')}</div></div>
        <div class="meta-cell"><div class="meta-key">Teléfono</div><div class="meta-val">${esc(b.phone||'—')}</div></div>
        <div class="meta-cell"><div class="meta-key">Recibido</div><div class="meta-val">${formatDate(b.submitted_at)}</div></div>
      </div>

      ${sectionsHtml}

      ${b.brief_text ? `
      <div class="section">
        <div class="section-title">Brief completo (texto)</div>
        <pre id="brief-text-content" style="font-family:monospace;font-size:11px;color:var(--gl);white-space:pre-wrap;line-height:1.7;background:var(--g1);padding:16px;border-radius:8px;overflow-x:auto">${esc(b.brief_text)}</pre>
      </div>` : ''}
    </div>`;
}

/* ── STATUS UPDATE ── */
async function updateStatus(id, status) {
  try {
    await fetch(`${WORKER}/briefs/${id}/status`, {
      method: 'PATCH',
      headers: { 'X-API-Key': apiKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    const b = briefs.find(x => x.brief_id === id);
    if (b) b.status = status;
    renderList();
  } catch {
    alert('Error al actualizar el status.');
  }
}

/* ── COPY BRIEF ── */
function buildBriefText(b) {
  if (!b) return '';
  const parseArr = v => { try { const p = JSON.parse(v); return Array.isArray(p) ? p : [v]; } catch { return v ? [v] : []; } };
  const lines = [];
  lines.push(`BRIEF ${b.brief_id}`);
  lines.push(`Nombre: ${b.name || '—'}`);
  lines.push(`Empresa: ${b.business_name || b.company || '—'}`);
  lines.push(`Email: ${b.email || '—'}`);
  lines.push(`Teléfono: ${b.phone || '—'}`);
  lines.push(`Recibido: ${formatDate(b.submitted_at)}`);
  lines.push('');
  for (const [sId, keys] of Object.entries(SECTIONS)) {
    lines.push(`── ${SECTION_LABELS[sId].toUpperCase()} ──`);
    for (const k of keys) {
      const raw = b[k];
      let val = raw;
      if (typeof raw === 'string' && (raw.startsWith('[') || raw.startsWith('{'))) {
        const arr = parseArr(raw);
        val = arr.length ? arr.join(' · ') : null;
      }
      const empty = !val || String(val).trim() === '';
      lines.push(`${FIELD_LABELS[k] || k}: ${empty ? '—' : String(val)}`);
    }
    lines.push('');
  }
  if (b.brief_text) {
    lines.push('── BRIEF COMPLETO ──');
    lines.push(b.brief_text);
  }
  return lines.join('\n');
}

function copyBrief() {
  const el = document.getElementById('brief-text-content');
  const text = el ? el.textContent : buildBriefText(currentBrief);
  if (!text) return;
  const btn = document.querySelector('.btn-copy');
  const done = () => {
    btn.textContent = '¡Copiado!';
    setTimeout(() => btn.textContent = 'Copiar brief', 1800);
  };
  const fail = () => {
    btn.textContent = 'Error al copiar';
    setTimeout(() => btn.textContent = 'Copiar brief', 1800);
  };
  // Fallback if Clipboard API not available (http, old browsers)
  if (!navigator.clipboard) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch { fail(); }
    document.body.removeChild(ta);
    return;
  }
  navigator.clipboard.writeText(text).then(done).catch(fail);
}

/* ── HELPERS ── */
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
  return d.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'America/Mexico_City' });
}

/* ── INIT ── */
const saved = sessionStorage.getItem('cs_admin_key');
if (saved) { apiKey = saved; loadBriefs(); }
</script>
</body>
</html>
