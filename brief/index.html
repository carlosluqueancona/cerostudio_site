  <link rel="stylesheet" href="../css/base.css">
  <style>
    :root {
      --gt: #777777; --gl: #aaaaaa;
      --f: var(--fb);
    }
    body { display: flex; flex-direction: column; min-height: 100dvh; }

    /* ── HEADER */
    #hd {
      position: sticky; top: 0; z-index: 100; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.04); background: var(--black);
    }
    #dots { display: flex; gap: 4px; align-items: center; }
    .dot { height: 3px; border-radius: 2px; transition: all .5s cubic-bezier(.16,1,.3,1); }

    /* ── MAIN */
    #mn { flex: 1; display: flex; justify-content: center; padding: 36px 20px 140px; overflow-y: auto; }
    #ct { max-width: 580px; width: 100%; }
    .fade { animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:none } }

    /* ── TYPOGRAPHY */
    .sn { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gt); margin-bottom: 6px; font-weight: 600; }
    .st { font-size: 28px; font-weight: 700; font-family: var(--fd); letter-spacing: -.035em; margin: 0 0 6px; line-height: 1.1; }
    .st.big { font-size: 40px; }
    .sd { font-size: 14px; color: var(--gt); margin: 0 0 36px; line-height: 1.5; }

    /* ── FIELDS */
    .field { margin-bottom: 28px; }
    .lbl { display: block; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.85); margin-bottom: 10px; letter-spacing: .01em; }
    .req { color: var(--lime); margin-left: 4px; font-size: 11px; }
    .inp, .ta {
      width: 100%; padding: 13px 0; background: transparent; border: none;
      border-bottom: 1px solid rgba(255,255,255,.1); color: var(--white);
      font-size: 15px; font-family: var(--fd); outline: none;
      transition: border-color .3s ease; letter-spacing: .01em;
    }
    .inp:focus, .ta:focus { border-bottom-color: var(--lime); }
    .ta { resize: vertical; min-height: 72px; }

    /* ── RADIO */
    .rg { display: flex; flex-direction: column; gap: 6px; }
    .rb {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: transparent; border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
      cursor: pointer; text-align: left; font-family: var(--fd); color: var(--gl);
      font-size: 14px; width: 100%; transition: all .25s ease;
    }
    .rb:hover { border-color: rgba(255,255,255,.15); }
    .rb.on { background: rgba(184,255,0,.06); border-color: var(--lime); color: var(--white); }
    .rc { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; transition: border-color .25s ease; }
    .rb.on .rc { border-color: var(--lime); }
    .rd { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); display: none; }
    .rb.on .rd { display: block; }

    /* ── CHECKBOX */
    .cg { display: flex; flex-wrap: wrap; gap: 6px; }
    .cb {
      padding: 9px 16px; background: transparent; color: var(--gl);
      border: 1px solid rgba(255,255,255,.08); border-radius: 24px;
      cursor: pointer; font-size: 13px; font-family: var(--fd); font-weight: 400;
      transition: all .2s ease;
    }
    .cb.on { background: var(--lime); color: var(--black); border-color: var(--lime); font-weight: 600; }

    /* ── WELCOME BOX */
    .wbox { padding: 16px 20px; background: rgba(184,255,0,.04); border: 1px solid rgba(184,255,0,.1); border-radius: 10px; margin-top: 8px; }
    .eyebrow { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--lime); margin-bottom: 10px; font-weight: 700; }
    .prow { display: flex; gap: 12px; align-items: baseline; margin-bottom: 6px; }
    .pnum { font-size: 11px; color: var(--lime); font-weight: 700; min-width: 20px; }
    .ptitle { font-size: 13px; color: var(--white); font-weight: 600; }
    .pdesc { font-size: 12px; color: var(--gt); }

    /* ── REVIEW */
    .rsec { margin-bottom: 28px; }
    .rlbl { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--lime); margin-bottom: 14px; font-weight: 700; }
    .ritem { margin-bottom: 10px; }
    .rkey { font-size: 11px; color: var(--gt); margin-bottom: 2px; }
    .rval { font-size: 14px; color: var(--white); line-height: 1.5; }

    /* ── FOOTER NAV */
    #ft {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 24px;
      background: linear-gradient(transparent, var(--black) 25%);
      display: flex; justify-content: space-between; align-items: center; z-index: 100;
    }
    .btn-back {
      padding: 12px 20px; background: transparent; border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; cursor: pointer; font-size: 12px; font-family: var(--fd);
      letter-spacing: .04em; text-transform: uppercase; font-weight: 600; color: var(--gl);
      transition: all .2s ease;
    }
    .btn-back:disabled { color: rgba(255,255,255,.1); border-color: rgba(255,255,255,.04); cursor: default; }
    .btn-next {
      padding: 14px 36px; background: var(--lime); color: var(--black); border: none;
      border-radius: 8px; cursor: pointer; font-size: 13px; font-family: var(--fd);
      letter-spacing: .06em; text-transform: uppercase; font-weight: 800; transition: all .2s ease;
    }
    .btn-next:disabled { background: var(--gray3); cursor: default; opacity: .5; }

    /* ── SUCCESS */
    .success { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 32px; }
    .si { text-align: center; max-width: 500px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 20px;
      background: rgba(184,255,0,.08); border: 1px solid rgba(184,255,0,.2); margin-bottom: 20px;
    }
    .bdot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }
    .btxt { font-size: 11px; color: var(--lime); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .sbox { padding: 16px 20px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06); border-radius: 10px; margin: 24px 0 32px; text-align: left; }
    .srow { display: flex; gap: 10px; align-items: baseline; margin-bottom: 5px; }
    .snum { font-size: 10px; color: var(--lime); font-weight: 700; min-width: 18px; }
    .stxt { font-size: 13px; color: var(--gl); }
    .wa-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 15px 36px;
      background: var(--lime); color: var(--black); border: none; border-radius: 8px;
      font-size: 13px; font-family: var(--fd); cursor: pointer; letter-spacing: .06em;
      text-transform: uppercase; font-weight: 800; text-decoration: none;
    }

    /* ── SVG pulse */
    @keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .pulse { animation: dotPulse 2.4s ease-in-out infinite; }
  </style>

<script>
/* ── CONFIG ────────────────────────────────────────────── */
const WORKER             = 'https://intake.cerostudio.ai';
const WA_NUM             = '525531007101';
const TURNSTILE_SITE_KEY = '0x4AAAAAAC-D_ms0Xx25W9m6';

/* ── DATA ──────────────────────────────────────────────── */
const STEPS = [
  { id:'welcome',  label:'Inicio' },
  { id:'contact',  label:'Contacto' },
  { id:'business', label:'Negocio' },
  { id:'project',  label:'Proyecto' },
  { id:'design',   label:'Dirección Visual' },
  { id:'content',  label:'Contenido & Assets' },
  { id:'timeline', label:'Timeline & Budget' },
  { id:'review',   label:'Revisión' },
];

const FIELDS = {
  contact: [
    { key:'name',    label:'Nombre completo',                          type:'text',  required:true,  placeholder:'Tu nombre y apellido' },
    { key:'email',   label:'Correo electrónico',                       type:'email', required:true,  placeholder:'tu@correo.com' },
    { key:'phone',   label:'Teléfono / WhatsApp',                      type:'tel',   required:true,  placeholder:'+1 (555) 000-0000' },
    { key:'company', label:'Empresa o negocio',                        type:'text',  required:false, placeholder:'Si aplica' },
    { key:'lang',    label:'¿En qué idioma prefieres comunicarte?',    type:'radio', required:true,  options:['Español','English','Ambos — bilingüe'] },
  ],
  business: [
    { key:'businessName',    label:'Nombre del negocio (como aparecerá en el sitio)',   type:'text',     required:true,  placeholder:'Nombre comercial' },
    { key:'industry',        label:'Giro o industria',                                  type:'text',     required:true,  placeholder:'Ej: Restaurante, Consultoría legal, Retail...' },
    { key:'location',        label:'Ubicación principal del negocio',                   type:'text',     required:true,  placeholder:'Ciudad, Estado (Ej: Houston, TX)' },
    { key:'targetAudience',  label:'¿Quiénes son tus clientes ideales?',                type:'textarea', required:true,  placeholder:'Describe a quién le vendes: edad, ubicación, idioma, nivel socioeconómico, qué buscan...' },
    { key:'competitors',     label:'Competidores o negocios similares que admires',     type:'textarea', required:false, placeholder:'Nombres o URLs de negocios en tu industria cuya presencia digital te guste' },
    { key:'usp',             label:'¿Qué hace diferente a tu negocio?',                 type:'textarea', required:true,  placeholder:'Tu ventaja competitiva — lo que tus clientes dicen que los hizo elegirte' },
  ],
  project: [
    { key:'projectType', label:'¿Qué necesitas?', type:'check', required:true, options:[
      'Sitio web profesional (informativo)','Tienda en línea (eCommerce)','Sitio web + Blog / CMS',
      'Landing page (una sola página)','Rediseño de sitio existente','No estoy seguro — necesito asesoría',
    ]},
    { key:'currentSite',      label:'URL de tu sitio actual (si tienes uno)',    type:'text',     required:false, placeholder:'https://...' },
    { key:'currentSitePain',  label:'Si ya tienes sitio, ¿qué no funciona?',    type:'textarea', required:false, placeholder:'¿Qué te frustra de tu sitio actual? ¿Qué falla?' },
    { key:'pages', label:'¿Qué secciones necesita tu sitio?', type:'check', required:false, options:[
      'Inicio (Home)','Sobre Nosotros / Quiénes Somos','Servicios','Portafolio / Galería',
      'Tienda / Catálogo de productos','Blog / Noticias','Contacto','Reservaciones / Agendar cita',
      'Menú (Restaurante)','Testimonios / Reseñas','FAQ','Área de clientes / Login',
    ]},
    { key:'features', label:'Funcionalidades que necesitas', type:'check', required:false, options:[
      'Formulario de contacto','WhatsApp directo','Sistema de reservaciones / citas',
      'Carrito de compras / pagos en línea','Blog que yo pueda actualizar','Multi-idioma (Español / Inglés)',
      'Integración con redes sociales','Google Maps','Email marketing / Newsletter',
      'SEO optimizado','Google Analytics / métricas','Chat en vivo',
    ]},
    { key:'ecommProducts', label:'Si es tienda en línea: ¿cuántos productos?', type:'radio', required:false, options:['No aplica','1–20','20–50','50–200','Más de 200'] },
  ],
  design: [
    { key:'visualDirection', label:'¿Qué estilo visual te atrae más?', type:'check', required:true, options:[
      'Oscuro y premium (negro, contrastes fuertes)','Limpio y minimalista (mucho espacio blanco)',
      'Colorido y enérgico','Elegante y sofisticado','Moderno y tecnológico','Cálido y cercano',
      'Rústico / artesanal','Confío en la dirección creativa de Cero Studio',
    ]},
    { key:'referenceSites',  label:'Comparte 2-3 sitios web que te gusten y dinos por qué',  type:'textarea', required:false, placeholder:'URLs y qué te gusta de cada uno: ¿el diseño? ¿la estructura? ¿cómo se siente?' },
    { key:'avoidance',       label:'¿Hay algo que NO quieras en tu sitio?',                   type:'textarea', required:false, placeholder:'Colores que odias, estilos que no van con tu marca, cosas que no te gustan...' },
    { key:'hasLogo', label:'¿Tienes logotipo?', type:'radio', required:true, options:['Sí — profesional y listo para usar','Sí — pero necesita actualizarse','No — necesito uno'] },
    { key:'hasBrandColors', label:'¿Tienes colores de marca definidos?', type:'radio', required:true, options:['Sí — tengo paleta definida','Tengo idea pero no está formalizado','No — necesito que me propongan'] },
    { key:'brandColorsDetail', label:'Si tienes colores, compártelos aquí', type:'text', required:false, placeholder:'Ej: Azul marino #1B3A5C y dorado #C9A84C' },
  ],
  content: [
    { key:'contentStatus', label:'¿Qué contenido tienes listo?', type:'radio', required:true, options:[
      'Todo listo (textos, fotos, videos)','Parcial — tengo fotos pero me faltan textos',
      'Parcial — tengo textos pero me faltan fotos','Nada — necesito que Cero Studio genere todo',
    ]},
    { key:'photoStatus', label:'Fotografía de tu negocio / productos', type:'radio', required:true, options:[
      'Tengo fotos profesionales de alta calidad','Tengo fotos pero no son profesionales',
      'No tengo — pueden usar stock o IA','Necesito servicio de fotografía (cotización aparte)',
    ]},
    { key:'hasExistingContent', label:'¿Tienes materiales existentes que quieras reutilizar?', type:'check', required:false, options:[
      'Logotipo en alta resolución','Manual de marca / guía de identidad','Fotos de productos',
      'Fotos del negocio / equipo','Textos ya redactados','Videos','Menú / catálogo en PDF','Nada de lo anterior',
    ]},
    { key:'contentNotes', label:'Notas sobre contenido', type:'textarea', required:false, placeholder:'¿Hay algo específico que quieras comunicar? ¿Un mensaje clave? ¿Un tono particular?' },
  ],
  timeline: [
    { key:'goal', label:'Objetivo principal del sitio', type:'radio', required:true, options:[
      'Generar clientes / leads','Vender productos en línea','Dar presencia profesional a mi negocio',
      'Reemplazar mi sitio actual','Posicionarme en Google (SEO)','Informar y educar a mis clientes',
    ]},
    { key:'budget', label:'Presupuesto aproximado (USD)', type:'radio', required:true, options:[
      'Menos de $800','$800 – $1,500','$1,500 – $3,000','$3,000 – $5,000','Más de $5,000',
      'No estoy seguro — necesito cotización',
    ]},
    { key:'timeline', label:'¿Cuándo necesitas el sitio listo?', type:'radio', required:true, options:[
      'Lo antes posible (urgente)','2 a 4 semanas','1 a 2 meses',
      'Sin prisa — quiero que quede perfecto','Tengo fecha específica',
    ]},
    { key:'deadlineDetail',  label:'Si tienes fecha específica, ¿cuál es?',                        type:'text',     required:false, placeholder:'Ej: Antes del 15 de junio — lanzamiento de producto' },
    { key:'maintenance',     label:'¿Te interesa mantenimiento mensual después del lanzamiento?',   type:'radio',    required:false, options:['Sí — quiero que Cero Studio lo mantenga','Tal vez — quiero saber más','No — yo me encargo después'] },
    { key:'additionalNotes', label:'¿Algo más que debamos saber?',                                  type:'textarea', required:false, placeholder:'Cualquier detalle, preocupación o pregunta...' },
  ],
};

const DESCS = {
  welcome:  'Cuéntanos sobre tu proyecto para diseñar algo extraordinario.',
  contact:  '¿Con quién estaremos trabajando?',
  business: 'Necesitamos entender tu negocio para diseñar algo que funcione.',
  project:  'Define el alcance de lo que necesitas.',
  design:   'Esto alimenta directamente el diseño visual en Google Stitch.',
  content:  '¿Qué materiales tienes listos para arrancar?',
  timeline: 'Plazos, presupuesto y objetivos.',
  review:   'Revisa que todo esté correcto antes de enviar.',
};

/* ── STATE ─────────────────────────────────────────────── */
const S = { step: 0, data: {}, sending: false, briefId: null };

/* ── TURNSTILE ─────────────────────────────────────────── */
let tsWidgetId        = null;
let tsToken           = null;
let tsPendingResolve  = null;

function onloadTurnstile() {
  tsWidgetId = turnstile.render('#cf-ts', {
    sitekey:            TURNSTILE_SITE_KEY,
    size:               'invisible',
    execution:          'execute',
    callback(token) {
      tsToken = token;
      if (tsPendingResolve) { tsPendingResolve(token); tsPendingResolve = null; }
    },
    'error-callback'() {
      if (tsPendingResolve) { tsPendingResolve(null); tsPendingResolve = null; }
    },
    'expired-callback'() { tsToken = null; },
  });
}

function getTurnstileToken() {
  return new Promise(resolve => {
    if (tsToken) return resolve(tsToken);
    if (!window.turnstile || tsWidgetId === null) return resolve(null);
    tsPendingResolve = resolve;
    turnstile.execute(tsWidgetId);
    setTimeout(() => {
      if (tsPendingResolve) { tsPendingResolve(null); tsPendingResolve = null; }
    }, 15000);
  });
}

/* ── HELPERS ───────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function hasVal(v) { return v && (Array.isArray(v) ? v.length > 0 : String(v).trim().length > 0); }

function canProceed() {
  const { id } = STEPS[S.step];
  if (id === 'welcome' || id === 'review') return true;
  return (FIELDS[id] || []).filter(f => f.required).every(f => hasVal(S.data[f.key]));
}

/* ── RENDER HELPERS ────────────────────────────────────── */
function renderField(f) {
  const v = S.data[f.key];
  const lbl = `<label class="lbl">${esc(f.label)}${f.required ? '<span class="req">*</span>' : ''}</label>`;

  if (f.type === 'radio') {
    const opts = f.options.map(opt => {
      const on = v === opt;
      return `<button class="rb${on?' on':''}" data-radio="${esc(f.key)}" data-val="${esc(opt)}">
        <div class="rc"><div class="rd"></div></div>
        <span>${esc(opt)}</span>
      </button>`;
    }).join('');
    return `<div class="field">${lbl}<div class="rg">${opts}</div></div>`;
  }

  if (f.type === 'check') {
    const sel = v || [];
    const opts = f.options.map(opt =>
      `<button class="cb${sel.includes(opt)?' on':''}" data-check="${esc(f.key)}" data-val="${esc(opt)}">${esc(opt)}</button>`
    ).join('');
    return `<div class="field">${lbl}<div class="cg">${opts}</div></div>`;
  }

  if (f.type === 'textarea') {
    return `<div class="field">${lbl}<textarea class="ta" data-key="${esc(f.key)}" placeholder="${esc(f.placeholder||'')}" rows="3">${esc(v||'')}</textarea></div>`;
  }

  return `<div class="field">${lbl}<input class="inp" type="${f.type}" data-key="${esc(f.key)}" value="${esc(v||'')}" placeholder="${esc(f.placeholder||'')}"></div>`;
}

function renderWelcome() {
  return `
    <div style="color:var(--gl);font-size:15px;line-height:1.75">
      <p style="margin-bottom:20px">Este formulario genera tu <strong style="color:var(--white)">brief de proyecto</strong> — el documento que guía cada decisión de diseño y desarrollo.</p>
      <p style="margin-bottom:20px">Tiempo estimado: <strong style="color:var(--white)">10–12 minutos</strong>. Toda la información es confidencial.</p>
      <div class="wbox">
        <div class="eyebrow">Nuestro proceso</div>
        ${[['01','Brief','Este formulario — nos cuentas todo sobre tu negocio'],['02','Propuesta','Te enviamos una propuesta personalizada en 24 hrs'],['03','Diseño','Definimos la dirección visual y estructura del sitio'],['04','Desarrollo','Construimos tu sitio con estándares internacionales'],['05','Entrega','QA, optimización SEO y lanzamiento']].map(([n,t,d]) =>
          `<div class="prow"><span class="pnum">${n}</span><span class="ptitle">${t}</span><span class="pdesc">&nbsp;— ${d}</span></div>`
        ).join('')}
      </div>
    </div>`;
}

function renderReview() {
  return ['contact','business','project','design','content','timeline'].map(sId => {
    const sf = FIELDS[sId];
    const sl = STEPS.find(s => s.id === sId)?.label || sId;
    if (!sf.some(f => hasVal(S.data[f.key]))) return '';
    const items = sf.map(f => {
      const v = S.data[f.key];
      if (!hasVal(v)) return '';
      return `<div class="ritem"><div class="rkey">${esc(f.label)}</div><div class="rval">${esc(Array.isArray(v) ? v.join(' · ') : v)}</div></div>`;
    }).join('');
    return `<div class="rsec"><div class="rlbl">${esc(sl)}</div>${items}</div>`;
  }).join('');
}

/* ── MAIN RENDER ───────────────────────────────────────── */
function render() {
  const { id, label } = STEPS[S.step];
  const total = STEPS.length;

  /* Dots */
  $('dots').innerHTML = STEPS.map((_,i) => {
    const w = i === S.step ? 24 : 6;
    const bg = i === S.step ? '#b2f700' : i < S.step ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.08)';
    return `<div class="dot" style="width:${w}px;background:${bg}"></div>`;
  }).join('');

  /* Step number */
  const numHtml = id !== 'welcome' && id !== 'review'
    ? `<div class="sn">${String(S.step).padStart(2,'0')} / ${String(total-2).padStart(2,'0')}</div>` : '';

  /* Content */
  let body = '';
  if (id === 'welcome') body = renderWelcome();
  else if (id === 'review') body = renderReview();
  else body = (FIELDS[id] || []).map(f => renderField(f)).join('');

  $('ct').innerHTML = `<div class="fade">${numHtml}<h1 class="st${id==='welcome'?' big':''}">${esc(label)}</h1><p class="sd">${esc(DESCS[id]||'')}</p>${body}</div>`;

  /* Scroll top */
  $('mn').scrollTop = 0;

  /* Nav */
  const back = $('btn-back');
  const next = $('btn-next');
  back.disabled = S.step === 0;
  back.style.color = S.step === 0 ? 'rgba(255,255,255,.1)' : '';
  back.style.borderColor = S.step === 0 ? 'rgba(255,255,255,.04)' : '';
  next.textContent = id === 'review' ? (S.sending ? 'Enviando...' : 'Enviar Brief →') : 'Continuar →';
  next.disabled = !canProceed() || S.sending;
}

function refreshNext() {
  $('btn-next').disabled = !canProceed() || S.sending;
}

/* ── EVENTS (delegated) ────────────────────────────────── */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.key) { S.data[el.dataset.key] = el.value; refreshNext(); }
});

document.addEventListener('click', e => {
  /* Radio */
  const rb = e.target.closest('[data-radio]');
  if (rb) {
    S.data[rb.dataset.radio] = rb.dataset.val;
    document.querySelectorAll(`[data-radio="${rb.dataset.radio}"]`).forEach(b =>
      b.classList.toggle('on', b.dataset.val === rb.dataset.val)
    );
    refreshNext();
    return;
  }

  /* Checkbox */
  const cb = e.target.closest('[data-check]');
  if (cb) {
    const key = cb.dataset.check;
    const val = cb.dataset.val;
    const cur = S.data[key] || [];
    S.data[key] = cur.includes(val) ? cur.filter(v => v !== val) : [...cur, val];
    cb.classList.toggle('on', S.data[key].includes(val));
    refreshNext();
    return;
  }
});

/* ── NAVIGATION ────────────────────────────────────────── */
$('btn-back').addEventListener('click', () => {
  if (S.step > 0) { S.step--; render(); }
});

$('btn-next').addEventListener('click', () => {
  const { id } = STEPS[S.step];
  if (id === 'review') { handleSubmit(); }
  else if (S.step < STEPS.length - 1) { S.step++; render(); }
});

/* ── SUBMIT ────────────────────────────────────────────── */
async function handleSubmit() {
  S.sending = true;
  render();

  const briefText = generateBrief();
  const cfToken   = await getTurnstileToken();

  tsToken = null;
  if (tsWidgetId !== null) turnstile.reset(tsWidgetId);

  try {
    const res = await fetch(`${WORKER}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...S.data, briefText, cf_turnstile_response: cfToken || '' }),
    });
    const result = await res.json();
    if (!result.success) throw new Error(result.error || 'Error del servidor');
    S.briefId = result.briefId;
    S.sending = false;
    showSuccess();
  } catch(err) {
    S.sending = false;
    showError(briefText, err.message);
  }
}

function showError(briefText, errMsg) {
  const subj = encodeURIComponent(`Nuevo Brief — ${S.data.businessName || S.data.name || ''}`);
  const body = encodeURIComponent(briefText);

  $('hd').style.display = 'none';
  $('ft').style.display = 'none';
  $('mn').style.padding = '0';

  $('ct').innerHTML = `
    <div class="success">
      <div class="si">
        <div style="margin-bottom:24px;font-size:40px">⚠️</div>
        <h1 style="color:var(--white);font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 12px">Hubo un problema al enviar</h1>
        <p style="color:var(--gl);font-size:14px;line-height:1.6;margin:0 0 8px">
          Tu información <strong style="color:var(--white)">no se perdió</strong>. Tienes dos opciones para enviárnosla:
        </p>
        <div class="sbox" style="margin:20px 0">
          <div style="margin-bottom:14px">
            <div style="font-size:11px;color:var(--lime);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">Opción 1 — Reintenta</div>
            <button onclick="location.reload()" style="padding:12px 28px;background:var(--lime);color:var(--black);border:none;border-radius:8px;font-size:13px;font-family:var(--fd);font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;">
              Recargar y reintentar
            </button>
          </div>
          <div>
            <div style="font-size:11px;color:var(--lime);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">Opción 2 — Envía por correo</div>
            <a href="mailto:hola@cerostudio.ai?subject=${subj}&body=${body}"
               style="display:inline-block;padding:12px 28px;border:1px solid rgba(255,255,255,.15);border-radius:8px;font-size:13px;font-family:var(--fd);font-weight:600;color:var(--white);text-decoration:none;letter-spacing:.04em;">
              Abrir en mi correo
            </a>
          </div>
        </div>
        <p style="color:var(--gt);font-size:11px;margin:0">Error técnico: ${esc(errMsg)}</p>
      </div>
    </div>`;
}

function showSuccess() {
  const waMsg = encodeURIComponent(
    `Hola, acabo de enviar mi brief de proyecto para ${S.data.businessName || 'mi negocio'}. Mi nombre es ${S.data.name || ''}. ¿Cuál es el siguiente paso?`
  );
  const nextSteps = [
    ['01','Revisamos tu brief y preparamos una propuesta'],
    ['02','Llamada de 15 min para alinear dirección visual'],
    ['03','Diseñamos tu sitio en Google Stitch para tu aprobación'],
    ['04','Desarrollo e implementación'],
    ['05','QA, optimización y lanzamiento'],
  ];

  $('hd').style.display = 'none';
  $('ft').style.display = 'none';
  $('mn').style.padding = '0';

  $('ct').innerHTML = `
    <div class="success">
      <div class="si">
        <div style="margin-bottom:32px">
          <svg width="56" height="56" viewBox="0 0 100 100" class="pulse">
            <circle cx="50" cy="50" r="42" fill="none" stroke="white" stroke-width="7"/>
            <circle cx="50" cy="50" r="7.5" fill="white"/>
          </svg>
        </div>
        <div class="badge">
          <div class="bdot"></div>
          <span class="btxt">Brief enviado a Cero Studio${S.briefId ? ' — ' + esc(S.briefId) : ''}</span>
        </div>
        <h1 style="color:var(--white);font-size:32px;font-weight:800;letter-spacing:-.03em;margin:0 0 14px">¡Recibimos tu proyecto!</h1>
        <p style="color:var(--gl);font-size:15px;line-height:1.65;margin:0 0 12px">
          Tu brief ya está en manos de nuestro equipo. Te contactaremos en las próximas <strong style="color:var(--white)">24 horas</strong> con una propuesta personalizada.
        </p>
        <p style="color:var(--gt);font-size:13px;line-height:1.5;margin:0 0 10px">¿Quieres acelerar el proceso? Escríbenos directo por WhatsApp.</p>
        <div class="sbox">
          <div class="eyebrow">Siguientes pasos</div>
          ${nextSteps.map(([n,t]) => `<div class="srow"><span class="snum">${n}</span><span class="stxt">${t}</span></div>`).join('')}
        </div>
        <a href="https://wa.me/${WA_NUM}?text=${waMsg}" target="_blank" rel="noopener" class="wa-btn">
          Escribir por WhatsApp →
        </a>
      </div>
    </div>`;
}

/* ── BRIEF TEXT GENERATOR ──────────────────────────────── */
function generateBrief() {
  let t = '══════════════════════════════════════════\n  CERO STUDIO ◉ CLIENT BRIEF\n  cerostudio.ai\n══════════════════════════════════════════\n\n';
  ['contact','business','project','design','content','timeline'].forEach(sId => {
    const sf = FIELDS[sId];
    const sl = STEPS.find(s => s.id === sId)?.label || sId;
    t += `── ${sl.toUpperCase()} ${'─'.repeat(Math.max(0,38-sl.length))}\n\n`;
    sf.forEach(f => {
      const v = S.data[f.key];
      if (hasVal(v)) t += `  ${f.label}\n  → ${Array.isArray(v) ? v.join(', ') : v}\n\n`;
    });
  });
  t += `══════════════════════════════════════════\nFecha: ${new Date().toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'})}\nGenerado por Cero Studio Intake System\n`;
  return t;
}

/* ── INIT ──────────────────────────────────────────────── */
render();
</script>
</body>
</html>
