<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog de Cero Studio — Consejos sobre diseño web, marketing digital y SEO.">
  <title>Blog — Cero Studio</title>
  <link rel="icon" href="/images/svg/CS_Favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/blog/blog.css">
</head>

<body>
  <div class="site-wrapper">
    <!-- Navbar -->
    <nav id="navbar">
      <a href="/">
        <img src="/images/svg/CS_Logo_White.svg" alt="Cero Studio" class="nav-logo">
      </a>
      <ul class="nav-links">
        <li><a href="/#servicios">Servicios</a></li>
        <li><a href="/#portafolio">Portafolio</a></li>
        <li><a href="/blog/">Blog</a></li>
      </ul>
      <a href="/#contacto" class="nav-cta">Cotizar Proyecto</a>
    </nav>

    <!-- Main Content Root -->
    <div id="blog-root">
      <div id="blog-loader" style="padding: 200px 48px; text-align: center; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.2em; color: var(--lime);">
        CARGANDO BLOG...
      </div>
    </div>

    <!-- Footer (Simplified) -->
    <footer style="background: var(--surface-lowest); padding: 100px 48px; border-top: 1px solid var(--surface-high);">
      <div class="section-inner" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 40px;">
        <div>
          <img src="/images/svg/CS_Logo_White.svg" alt="Cero Studio" style="height: 30px; margin-bottom: 20px;">
          <p style="color: var(--gt); font-size: 14px; max-width: 300px;">Agencia digital premium enfocada en resultados reales y diseño de clase mundial.</p>
        </div>
        <div style="display: flex; gap: 40px;">
          <a href="/" style="color: var(--white); font-size: 14px;">Inicio</a>
          <a href="/#servicios" style="color: var(--white); font-size: 14px;">Servicios</a>
          <a href="/blog/" style="color: var(--white); font-size: 14px;">Blog</a>
        </div>
      </div>
      <div class="section-inner" style="margin-top: 60px; padding-top: 40px; border-top: 1px solid var(--surface-high); color: var(--gt); font-size: 12px; display: flex; justify-content: space-between;">
        <p>&copy; 2026 Cero Studio. Todos los derechos reservados.</p>
        <p>Hecho con <span style="color: var(--lime);">&hearts;</span> en México.</p>
      </div>
    </footer>
  </div>

  <script src="/blog/blog.js"></script>
</body>

</html>
