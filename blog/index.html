<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog de Cero Studio — Consejos sobre diseño web, marketing digital y SEO.">
  <title>Blog — Cero Studio</title>
  <link rel="icon" href="/images/svg/CS_Favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts loaded asynchronously to avoid render-blocking -->
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  </noscript>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/blog/blog.css">
</head>

<body>
  <div class="site-wrapper">
    <script src="/components/loader.js" defer></script>
    <!-- Grain Overlay -->
    <svg class="noise" xmlns="http://www.w3.org/2000/svg" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: .05; z-index: 1000;">
      <filter id="nf">
        <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="4" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#nf)" />
    </svg>

    <div id="navbar-placeholder"></div>

    <!-- Main Content Root -->
    <main id="blog-root" role="main"><a id="main-content" tabindex="-1"></a>
      <div id="blog-loader" style="padding: 200px 48px; text-align: center; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.2em; color: var(--lime);">
        CARGANDO BLOG...
      </div>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <script src="/blog/blog.js"></script>
</body>

</html>
